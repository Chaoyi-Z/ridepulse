# RidePulse — xcodegen project spec
# Usage on your Mac:
#   1. brew install xcodegen   (skip if already installed)
#   2. cd into this folder, then:  xcodegen generate
#   3. Open RidePulse.xcodeproj in Xcode, select your Team under
#      Signing & Capabilities for both targets, then build (Cmd+R).
# If the build throws errors, run `codex` in this folder and paste them in.

name: RidePulse
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

schemes:
  RidePulse:
    build:
      targets:
        RidePulse: all
    run:
      config: Debug
    archive:
      config: Release
  RidePulseWatch:
    build:
      targets:
        RidePulseWatch: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  RidePulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ios
        excludes:
          - "Info-plist-keys.txt"
      - path: shared
    info:
      path: ios/Info.plist
      properties:
        CFBundleDisplayName: RidePulse
        NSSupportsLiveActivities: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Route
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografix.gpx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: "RidePulse uses Bluetooth to connect to your 4iiii power meter."
        NSLocationWhenInUseUsageDescription: "RidePulse uses your location to track live speed, distance, and draw your route on the map."
        NSLocationAlwaysAndWhenInUseUsageDescription: "RidePulse keeps tracking your route in the background while a ride is recording."
        NSHealthShareUsageDescription: "RidePulse reads your weight, age and sex from Health to estimate the calories you burn on rides."
        NSHealthUpdateUsageDescription: "RidePulse saves your rides to Apple Health as cycling workouts with route, heart rate and power."
        CFBundleURLTypes:
          - CFBundleURLName: com.chaoyi.ridepulse.oauth
            CFBundleURLSchemes:
              - ridepulse
        UIBackgroundModes:
          - bluetooth-central
          - location
    entitlements:
      path: ios/RidePulse.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaoyi.ridepulse.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: RidePulseWatch
      - target: RidePulseWidgets

  RidePulseWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: widgets
      - path: shared
    info:
      path: widgets/Info.plist
      properties:
        CFBundleDisplayName: RidePulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaoyi.ridepulse.app.widgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  RidePulseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: watchos
        excludes:
          - "Info.plist"
    info:
      path: watchos/Info.plist
      properties:
        CFBundleDisplayName: RidePulse
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chaoyi.ridepulse.app
        NSHealthShareUsageDescription: "RidePulse reads your heart rate during rides."
        NSHealthUpdateUsageDescription: "RidePulse saves your cycling workouts."
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: watchos/RidePulseWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # Watch app bundle ID must be prefixed by the iPhone app's bundle ID.
        PRODUCT_BUNDLE_IDENTIFIER: com.chaoyi.ridepulse.app.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
